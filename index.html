<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Твоё имя на языке роблокс</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #88D100;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  .card {
    background: #88D100;
    width: 520px;
    padding: 28px 28px 38px 28px;
  }

  .top-section {
    display: flex;
    align-items: flex-start;
    margin-bottom: 28px;
  }

  .title {
    font-family: 'Arial Black', 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 66px;
    color: #111111;
    line-height: 1.02;
    flex: 1;
    letter-spacing: -0.5px;
  }

  .roblox-char {
    width: 200px;
    flex-shrink: 0;
    margin-top: -20px;
    margin-right: -10px;
  }

  .roblox-char img {
    width: 100%;
    height: auto;
    display: block;
  }

  .fields {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .field-label {
    font-size: 17px;
    font-weight: 400;
    color: #111111;
    font-family: Arial, sans-serif;
    min-width: 188px;
  }

  .field-input {
    border: 2px solid #111111;
    background: white;
    padding: 5px 10px;
    font-size: 16px;
    font-family: Arial, sans-serif;
    color: #555;
    letter-spacing: 1px;
    outline: none;
    border-radius: 0;
  }

  .card-number-input {
    width: 250px;
    letter-spacing: 4px;
    font-size: 16px;
    color: #333;
  }

  .expiry-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .expiry-input {
    width: 52px;
    text-align: center;
    padding: 5px 6px;
    color: #444;
  }

  .slash {
    font-size: 22px;
    font-weight: normal;
    color: #111111;
  }

  .name-input {
    width: 250px;
    text-transform: uppercase;
    font-size: 13px;
    color: #555;
  }

  .cvv-input {
    width: 75px;
    text-align: center;
    letter-spacing: 4px;
    color: #555;
  }

  .submit-btn {
    background: #111111;
    color: #88D100;
    border: none;
    padding: 11px 0;
    font-size: 18px;
    font-weight: 900;
    font-family: 'Arial Black', sans-serif;
    cursor: pointer;
    margin-top: 20px;
    display: block;
    width: 100%;
    letter-spacing: 1px;
  }

  .submit-btn:hover { background: #2a2a2a; }

  .joke-note {
    font-size: 11px;
    color: #2d5a00;
    text-align: center;
    margin-top: 7px;
    font-family: Arial, sans-serif;
  }

  .result-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.72);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .result-overlay.show { display: flex; }

  .result-box {
    background: #88D100;
    border: 4px solid #111111;
    padding: 38px 50px;
    text-align: center;
    max-width: 400px;
    min-width: 320px;
  }

  .result-box h2 {
    font-family: 'Arial Black', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #111111;
    margin-bottom: 14px;
  }

  .roblox-name {
    font-family: 'Arial Black', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: #111111;
    letter-spacing: 2px;
    margin: 8px 0 18px;
    word-break: break-all;
  }

  .close-btn {
    background: #111111;
    color: #88D100;
    border: none;
    padding: 11px 32px;
    font-size: 17px;
    font-weight: 900;
    font-family: 'Arial Black', sans-serif;
    cursor: pointer;
    margin-top: 8px;
  }
  .close-btn:hover { background: #333; }
</style>
</head>

        placeholder="0000  0000  0000  0000" maxlength="19" oninput="formatCard(this)">
    </div>
    <div class="field-row">
      <div class="field-label">Действительна до</div>
      <div class="expiry-group">
        <input class="field-input expiry-input" id="mm" type="text" placeholder="ММ" maxlength="2">
        <span class="slash">/</span>
        <input class="field-input expiry-input" id="yy" type="text" placeholder="ГГ" maxlength="2">
      </div>
    </div>
    <div class="field-row">
      <div class="field-label">Имя держателя карты</div>
      <input class="field-input name-input" id="cardName" type="text" placeholder="ИМЯ ФАМИЛИЯ ЛАТИНИЦЕЙ">
    </div>
    <div class="field-row">
      <div class="field-label">CVC2/CVV2</div>
      <input class="field-input cvv-input" id="cvv" type="text" placeholder="***" maxlength="3">
    </div>

    <button class="submit-btn" onclick="showRobloxName()">УЗНАТЬ ИМЯ </button>
  </div>
</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-box">
    <h2>Твоё имя на языке роблокс:</h2>
    <div class="roblox-name" id="robloxName"></div>
    <p style="font-size:15px;color:#111;font-family:Arial;">Поделись с друзьями! 😂</p>
    <button class="close-btn" onclick="closeResult()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
  function formatCard(input) {
    let val = input.value.replace(/\D/g, '').substring(0, 16);
    input.value = val.replace(/(.{4})/g, '$1 ').trim();
  }
  const names = [
    "xX_N00BSL4Y3R_Xx","GuestBlox2009","D4RK_R0BUX_K1NG",
    "BloxMaster_Pro","oBaMa_R0BLOX","XxAdminxX_2025",
    "N00bKiller9000","Ro_Bl0x_God","EPIC_GAMER_LOL",
    "CoolDude_Blox123","xXxROBLOXxXx","MegaNoob_777",
    "Bloxy_Legend_66","ProGamer_RBLX","DarkSword_X99"
  ];
  function showRobloxName() {
    const name = names[Math.floor(Math.random() * names.length)];
    document.getElementById('robloxName').textContent = name;
    document.getElementById('resultOverlay').classList.add('show');
  }
  function closeResult() {
    document.getElementById('resultOverlay').classList.remove('show');
  }
</script>
</body>
</html>
